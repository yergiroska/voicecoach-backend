[pytest]
testpaths = tests
# Los imports del proyecto son absolutos desde `app` (ver CLAUDE.md): con esto
# funcionan sin instalar el paquete ni exportar PYTHONPATH.
pythonpath = .
# Un warning de configuración que pase desapercibido es un test que no mide lo
# que parece; mejor que falle.
addopts = --strict-markers --strict-config
